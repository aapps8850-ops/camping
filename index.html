<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>粗坑露營區 - 前往預約系統</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 36px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .icon { font-size: 48px; margin-bottom: 12px; }
    h2 { font-size: 22px; color: #1e293b; margin-bottom: 8px; font-weight: 700; }
    p { color: #64748b; font-size: 15px; margin-bottom: 24px; }
    .btn {
      display: block;
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
      padding: 16px 20px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(37,99,235,0.3);
      transition: background 0.2s;
    }
    .btn:active { background: #1d4ed8; }
    .tip-box {
      margin-top: 24px;
      padding: 16px;
      background: #fef2f2;
      border: 1px solid #fee2e2;
      border-radius: 12px;
      text-align: left;
    }
    .tip-title {
      font-weight: 700;
      color: #dc2626;
      font-size: 15px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tip-desc {
      color: #7f1d1d;
      font-size: 13px;
      line-height: 1.6;
    }
    .step-highlight {
      font-weight: 700;
      color: #b91c1c;
      background: #fee2e2;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">🏕️</div>
    <h2>粗坑露營區 線上預約</h2>
    <p>正在為您開啟預約系統...</p>

    <a id="target-link" class="btn" href="https://script.google.com/macros/s/AKfycbxFKXeLKJblEKUl55FvOAU87BHMDviImgrta6LroZs9hnn27mnfZJQkFzsRurAXDYdD/exec">
      點此進入預約系統
    </a>

    <!-- iOS 專屬指引 -->
    <div id="ios-prompt" class="tip-box" style="display: none;">
      <div class="tip-title">
        <span>⚠️</span> 點擊後若畫面空白卡住：
      </div>
      <div class="tip-desc">
        1. 請看螢幕右上角或右下角圖示 <span class="step-highlight">⋯</span><br>
        2. 點選 <span class="step-highlight">在 Safari 中開啟</span> 即可正常預約！
      </div>
    </div>
  </div>

  <script>
    const directUrl = "https://script.google.com/macros/s/AKfycbxFKXeLKJblEKUl55FvOAU87BHMDviImgrta6LroZs9hnn27mnfZJQkFzsRurAXDYdD/exec";
    const ua = navigator.userAgent || navigator.vendor || window.opera;
    const isFB = /FBAN|FBAV/i.test(ua);
    const isAndroid = /Android/i.test(ua);
    const isIOS = /iPhone|iPad|iPod/i.test(ua);

    if (isAndroid) {
      // Android FB: 呼叫 Chrome Intent 直接跳外部 Chrome 開啟
      const noSchemeUrl = directUrl.replace(/^https?:\/\//, '');
      const chromeIntent = `intent://${noSchemeUrl}#Intent;scheme=https;package=com.android.chrome;end`;
      document.getElementById("target-link").href = chromeIntent;
      
      // 自動跳轉
      window.location.href = chromeIntent;
    } else if (isIOS && isFB) {
      // iOS FB: 展開操作指示
      document.getElementById("ios-prompt").style.display = "block";
    }
  </script>

</body>
</html>
